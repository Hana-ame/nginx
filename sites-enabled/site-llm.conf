server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name generativelanguage.moonchan.xyz;
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
    include /etc/nginx/snippets/doh.conf;
    include /etc/nginx/snippets/v2ray.conf;

    location / {
        # proxy_pass https://generativelanguage.googleapis.com;
        proxy_pass http://127.26.4.16:8080;
        proxy_set_header Host generativelanguage.googleapis.com;
        
        # --- 核心修改部分开始 ---
        
        # 1. 覆盖 X-Forwarded-For，设置为 $remote_addr
        # 此时 $remote_addr 是 Cloudflare 的 IP，不是你的真实 IP
        # 这让 Google 认为请求来自 Cloudflare（通常被允许）
        proxy_set_header X-Forwarded-For "";
        
        # 2. 清空可能暴露真实 IP 的其他头部
        # 设置为空字符串即可阻止转发 Cloudflare 传来的头部
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Real-IP "";
        
        # 3. (可选) 防止通过 Accept-Language 暴露位置
        # 如果你不需要特定的语言设置，可以强制设置为英语
        # proxy_set_header Accept-Language "en-US,en;q=0.9";

        # --- 核心修改部分结束 ---

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }
    access_log off;
    error_log /dev/null;
}