server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name groq.moonchan.xyz siliconflow.moonchan.xyz generativelanguage.moonchan.xyz;
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
    include /etc/nginx/conf.d/addon/doh.conf;
    include /etc/nginx/conf.d/addon/v2ray.conf;
    include /etc/nginx/sites-available/routes/route-llm.conf;
    error_log /dev/null;
}
