server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ex.moonchan.xyz eh-web-viewer.moonchan.xyz ehwv.moonchan.xyz ex.nmbyd4.top ex.810114.xyz;
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
    include /etc/nginx/snippets/doh.conf;
    include /etc/nginx/snippets/v2ray.conf;
    include /etc/nginx/sites-available/route/route-ex.conf;
    access_log off;
    error_log /dev/null;
}
