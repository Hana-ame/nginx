server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pximg.moonchan.xyz pximg.810114.xyz pximg.nmbyd2.top pximg.nmbyd3.top pximg.nmbyd4.top pximg.nmbyd5.top;
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
    include /etc/nginx/snippets/doh.conf;
    include /etc/nginx/snippets/v2ray.conf;
    include /etc/nginx/sites-available/pximg.conf;
    access_log off;
    error_log /dev/null;
}
