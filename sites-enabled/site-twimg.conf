server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name twimg.moonchan.xyz;
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
    include /etc/nginx/conf.d/addon/doh.conf;
    include /etc/nginx/conf.d/addon/v2ray.conf;
    include /etc/nginx/sites-available/routes/route-twimg.conf;
    access_log off;
    error_log /dev/null;
}
