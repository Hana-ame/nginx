server {
    listen 443 ssl http2;
    listen [::]:443;
    server_name  webclaw.moonchan.xyz;

    include conf.d/ssl/moonchan.xyz.conf;

    include sites-available/webclaw.conf;

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
