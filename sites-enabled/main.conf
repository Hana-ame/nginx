
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moonchan.xyz c.moonchan.xyz cloudcone.moonchan.xyz vps.moonchan.xyz;
    server_name 810114.xyz nmbyd2.top nmbyd3.top nmbyd4.top nmbyd5.top;

    # ssl configuration
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    access_log /dev/null;
    error_log /dev/null;

    #include /etc/nginx/conf.d/addon/general-deny.conf;

    # location / {
    #     add_header X-Frame-Options "ALLOWALL";
    #     root /var/www/html;
    # }

    # 精确匹配路径 /go/
    location = /go/ {
        return 302 https://moonchan.xyz/;
    }

    location = /shijima/ {
        proxy_pass http://127.0.1.1:8080/api/;
    }
    location = /api/ {
        proxy_pass http://127.0.1.1:8080/api/;
    }

    include /etc/nginx/conf.d/addon/3x-ui.conf;

    location /api/v2/ {
        add_header X-Frame-Options "ALLOWALL";
        proxy_pass http://127.25.5.19:8080/api/v2/;
    }

    location / {
        root /var/www/moonchan;
    }

    location = /ws/ {
        proxy_redirect off;
        proxy_pass http://127.114.5.14:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    include /etc/nginx/conf.d/addon/doh.conf;
    include /etc/nginx/conf.d/addon/v2ray.conf;

    # redirect server error pages to the static page /50x.html
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}


