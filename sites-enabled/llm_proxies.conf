server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name groq.moonchan.xyz;

    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    include /etc/nginx/sites-available/groq.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name siliconflow.moonchan.xyz;

    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    include /etc/nginx/sites-available/siliconflow.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name generativelanguage.moonchan.xyz; # 换成你的域名或服务器IP
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    location / {
        # 核心：反向代理到 Google Gemini 官方端点
        proxy_pass https://generativelanguage.googleapis.com;
        
        # 必须设置：保持 Host 头部正确，否则 Google 会拒绝请求
        proxy_set_header Host generativelanguage.googleapis.com;
        
        # 传递真实客户端 IP
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓存，确保流式输出（Streaming）正常工作
        proxy_buffering off;
        proxy_cache off;
        
        # 解决部分 SSL 握手问题
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }
}