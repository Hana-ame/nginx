# 各服务器专属 zen 入口 (v4): cloudcone / vps / bwh 三台合并
# 上游均为本机 ip-proxy_go (127.26.8.13:8080), 由 server_name 区分
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloudcone-zen-v6.moonchan.xyz;
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
    location /connect {
        proxy_pass http://127.26.8.13:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /status {
        proxy_pass http://127.26.8.13:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    access_log off;
    error_log /dev/null;
}

