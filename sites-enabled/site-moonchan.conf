server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moonchan.xyz vps.moonchan.xyz c.moonchan.xyz;
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
    include /etc/nginx/snippets/doh.conf;
    include /etc/nginx/snippets/v2ray.conf;
    include /etc/nginx/sites-available/moonchan.conf;
    access_log off;
    error_log /dev/null;
}

