server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name x.moonchan.xyz;
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
    include /etc/nginx/snippets/doh.conf;
    include /etc/nginx/snippets/v2ray.conf;
    include /etc/nginx/sites-available/route-twitter.conf;
    access_log off;
    error_log /dev/null;
}
