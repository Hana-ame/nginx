server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moonchan.publicvm.com;
    include /etc/nginx/conf.d/ssl/free_dns.conf;
    include /etc/nginx/snippets/doh.conf;
    include /etc/nginx/snippets/v2ray.conf;
    include /etc/nginx/sites-available/route/moonchan.conf;

    location ~ ^/ws/(browser|client)$ {
        proxy_pass http://127.26.3.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log off;
    error_log /dev/null;
}
