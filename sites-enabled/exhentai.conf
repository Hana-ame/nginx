
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ex.moonchan.xyz ehwv.moonchan.xyz eh-web-viewer.moonchan.xyz;
    server_name *.nmbyd2.top ex.nmbyd3.top;
    server_name ex.810114.xyz;
    

    # ssl configuration
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    access_log /dev/null;
    error_log /dev/null;

    #include /etc/nginx/conf.d/addon/general-deny.conf;

    # location / {
    #     add_header X-Frame-Options "ALLOWALL";
    #     root /var/www/html;
    # }

    location / {
        proxy_pass http://127.25.23.2:8080/;
    }


    include /etc/nginx/conf.d/addon/doh.conf;
    include /etc/nginx/conf.d/addon/v2ray.conf;

    # redirect server error pages to the static page /50x.html
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

