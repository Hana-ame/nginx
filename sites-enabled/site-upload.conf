server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upload.moonchan.publicvm.com;
    include /etc/nginx/conf.d/ssl/free_dns.conf;
    include /etc/nginx/snippets/doh.conf;
    include /etc/nginx/snippets/v2ray.conf;

    client_body_timeout 300s;
    include /etc/nginx/sites-available/upload.conf;

    access_log off;
    error_log /dev/null;
}

server {
    listen 80;
    server_name upload.moonchan.publicvm.com;

    access_log off;
    error_log /dev/null;

    client_body_timeout 300s;

    location / {
        add_header X-Frame-Options "ALLOWALL";
        try_files $uri $uri/ /index.html;
        root /var/www/upload;
    }

    location /api/ {
        client_max_body_size 50m;
        proxy_pass http://azure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
