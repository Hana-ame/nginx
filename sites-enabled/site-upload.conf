server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upload.moonchan.xyz upload.nmbyd2.top upload.nmbyd3.top upload.nmbyd4.top;
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
    include /etc/nginx/snippets/doh.conf;
    include /etc/nginx/snippets/v2ray.conf;

    client_body_timeout 300s;
    include /etc/nginx/sites-available/upload.conf;

    access_log off;
    error_log /dev/null;
}

