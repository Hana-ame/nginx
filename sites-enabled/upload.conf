upstream azure {
    server 127.23.12.17:8080;
    keepalive 32;
}

log_format cache_log '$remote_addr - $upstream_cache_status [$time_local] '
                     '"$request" $status $body_bytes_sent';

# ✅ 最大缓存改为 5g
proxy_cache_path /var/cache/nginx/upload_cache
                 levels=1:2
                 keys_zone=upload_cache:50m
                 max_size=2g
                 inactive=7d
                 use_temp_path=off;

open_file_cache max=10000 inactive=30s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

server {
    listen 443 ssl http2;
    server_name upload.moonchan.xyz upload.810114.xyz upload.nmbyd2.top upload.nmbyd3.top upload.nmbyd4.top;

    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    access_log /var/log/nginx/access.log cache_log gzip=6;
    error_log /dev/null;

    location / {
        root /var/www/upload;

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|zip|tar|gz|mp4|mp3|avi|mov|doc|docx|xls|xlsx|ppt|pptx|txt|bin|exe|iso)$ {
            add_header X-Frame-Options "ALLOWALL";
            add_header Cache-Control "public, max-age=31536000";
            add_header X-Cache-Status "LOCAL";
            add_header X-Cache-Source "disk";
            expires 1y;
            try_files $uri $uri/ =404;
        }

        add_header X-Frame-Options "ALLOWALL";
        try_files $uri $uri/ /index.html;
    }

    client_body_timeout 300s;

    location /api/ {
        client_max_body_size 50m;

        proxy_cache upload_cache;
        # ✅ 去掉查询参数
        proxy_cache_key "$scheme$request_method$host$uri";

        proxy_cache_valid 200 7d;
        proxy_cache_valid 206 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_valid any 1h;

        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        proxy_cache_convert_head off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        add_header X-Cache-Status $upstream_cache_status always;
        # ✅ 同步修改响应头中的 Key
        add_header X-Cache-Key "$scheme$request_method$host$uri";
        add_header X-Frame-Options "ALLOWALL";

        proxy_pass http://azure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /download/ {
        proxy_cache upload_cache;
        # ✅ 去掉查询参数
        proxy_cache_key "$scheme$request_method$host$uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 206 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;

        proxy_cache_convert_head off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Source "upstream";
        add_header X-Frame-Options "ALLOWALL";

        proxy_pass http://azure/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

