upstream azure {
    server 127.23.12.17:8080;
    
    # 保持 32 个长连接
    keepalive 32;
}
# ============================================
# 缓存区域定义（放在 http 块中，或在 conf.d 目录单独文件）
# ============================================
proxy_cache_path /var/cache/nginx/upload_cache 
                 levels=1:2           # 目录层级，防止单目录文件过多
                 keys_zone=upload_cache:50m   # 50MB 共享内存，约存 40 万个键
                 max_size=10g         # 最大缓存 10GB
                 inactive=7d          # 7天无人访问则删除
                 use_temp_path=off;   # 直接写入缓存目录，减少文件移动

# 文件打开缓存（优化静态文件访问）
open_file_cache max=10000 inactive=30s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

server {
    listen 443 ssl http2;
    server_name upload.moonchan.xyz upload.810114.xyz upload.nmbyd2.top upload.nmbyd3.top upload.nmbyd4.top;

    # ssl configuration
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    access_log /dev/null;
    error_log /dev/null;

    # ============================================
    # 静态文件服务（带本地文件缓存头）
    # ============================================
    location / {
        root /var/www/upload;
        
        # 静态文件缓存控制（浏览器缓存）
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|zip|tar|gz|mp4|mp3|avi|mov|doc|docx|xls|xlsx|ppt|pptx|txt|bin|exe|iso)$ {
            add_header X-Frame-Options "ALLOWALL";
            add_header Cache-Control "public, max-age=31536000";
            add_header X-Cache-Status "LOCAL";
            add_header X-Cache-Source "disk";
            expires 1y;
            try_files $uri $uri/ =404;
        }
        
        # 其他请求
        add_header X-Frame-Options "ALLOWALL";
        try_files $uri $uri/ /index.html;
    }

    client_body_timeout 300s;

    # ============================================
    # API 代理（带上游缓存）
    # ============================================
    location /api/ {
        client_max_body_size 50m;

        # 启用代理缓存
        proxy_cache upload_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        
        # 缓存有效期
        proxy_cache_valid 200 7d;
        proxy_cache_valid 206 7d;      # 支持断点续传
        proxy_cache_valid 404 1m;
        proxy_cache_valid any 1h;
        
        # 防止缓存穿透（并发请求只穿透一次）
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        
        # 过期时使用旧缓存 + 后台更新
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        
        # 允许 Range 请求（大文件下载）
        proxy_cache_convert_head off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        
        # 显示缓存状态
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key "$scheme$request_method$host$request_uri";
        add_header X-Frame-Options "ALLOWALL";

        # 代理配置
        proxy_pass http://azure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 长连接超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    
    # ============================================
    # 可选：单独的文件下载 location（如果需要）
    # ============================================
    location /download/ {
        # 从上游获取文件并缓存
        proxy_cache upload_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 206 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        
        # 支持大文件 Range 请求
        proxy_cache_convert_head off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        
        # 缓存状态头
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Source "upstream";
        add_header X-Frame-Options "ALLOWALL";
        
        # 代理到上游
        proxy_pass http://azure/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl http2;
    server_name upload.moonchan.publicvm.com;

    # ssl configuration
    include /etc/nginx/conf.d/ssl/free_dns.conf;

    access_log /dev/null;
    error_log /dev/null;

    location / {
        add_header X-Frame-Options "ALLOWALL";
        try_files $uri $uri/ /index.html;
        root /var/www/upload;
    }

    client_body_timeout 300s;

    location /api/ {
        client_max_body_size 50m;

        # 1. 必须指向 upstream 的名称
        proxy_pass http://azure;

        # 2. 必须设置 HTTP/1.1 协议（keepalive 必须）
        proxy_http_version 1.1;

        # 3. 清除 Connection 头部（允许长连接传递）
        proxy_set_header Connection "";

        # 4. 建议传递真实的 Host 和 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

