# upload
server {
    listen 443 ssl http2;
    server_name upload.moonchan.xyz upload.nmbyd2.top upload.nmbyd3.top upload.nmbyd4.top;

    # ssl configuration
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    access_log /dev/null;
    error_log /dev/null;

    location / {
        add_header X-Frame-Options "ALLOWALL";
        try_files $uri $uri/ /index.html;
        root /var/www/upload;
    }

    client_body_timeout 300s;

    location /api/ {
        client_max_body_size 50m;
        proxy_pass http://127.23.12.17:8080/api/;
    }

    include /etc/nginx/conf.d/addon/v2ray.conf;

    # redirect server error pages to the static page /50x.html
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}