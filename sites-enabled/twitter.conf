server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name x.moonchan.xyz;

    # ssl configuration
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    # access_log /dev/null;
    error_log /dev/null;

    include /etc/nginx/sites-available/twitter.conf;

    include /etc/nginx/conf.d/addon/doh.conf;
    include /etc/nginx/conf.d/addon/v2ray.conf;

}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name twimg.moonchan.xyz;

    # ssl configuration
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    # access_log /dev/null;
    error_log /dev/null;

    include /etc/nginx/sites-available/twimg.conf;

    include /etc/nginx/conf.d/addon/doh.conf;
    include /etc/nginx/conf.d/addon/v2ray.conf;

}

