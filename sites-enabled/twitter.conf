upstream twapi {
    server 127.25.9.21:8080;

    # 保持 32 个长连接
    keepalive 32;
}

server {
  listen 443 ssl http2;
  server_name x.moonchan.xyz x.nmbyd3.top x.810114.xyz;

  # ssl configuration
  include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

  access_log /dev/null;
  error_log /dev/null;

  location / {
    proxy_pass http://twapi;

    # 2. 必须设置 HTTP/1.1 协议（keepalive 必须）
    proxy_http_version 1.1;

    # 3. 清除 Connection 头部（允许长连接传递）
    proxy_set_header Connection "";

    # 4. 建议传递真实的 Host 和 IP
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

  }

  include /etc/nginx/conf.d/addon/doh.conf;
  include /etc/nginx/conf.d/addon/v2ray.conf;

  # redirect server error pages to the static page /50x.html
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}

