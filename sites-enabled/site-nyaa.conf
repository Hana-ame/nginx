server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nyaa.moonchan.xyz;
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
    include /etc/nginx/conf.d/addon/doh.conf;
    include /etc/nginx/conf.d/addon/v2ray.conf;
    include /etc/nginx/sites-available/route-nyaa.conf;
    access_log off;
    error_log /dev/null;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nyaa.nmbyd2.top;
    include /etc/nginx/conf.d/ssl/nmbyd.conf;
    include /etc/nginx/conf.d/addon/doh.conf;
    include /etc/nginx/conf.d/addon/v2ray.conf;
    include /etc/nginx/sites-available/route-nyaa.conf;
    access_log off;
    error_log /dev/null;
}
