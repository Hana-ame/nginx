location / {
    add_header X-Frame-Options "ALLOWALL";

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|zip|tar|gz|mp4|mp3|avi|mov|doc|docx|xls|xlsx|ppt|pptx|txt|bin|exe|iso)$ {
        add_header X-Frame-Options "ALLOWALL";
        add_header Cache-Control "public, max-age=31536000";
        expires 1y;
        try_files $uri $uri/ =404;
    }

    try_files $uri $uri/ /index.html;
    root /var/www/upload;
}

location /api/ {
    client_max_body_size 50m;

    proxy_cache upload_cache;
    proxy_cache_key "$scheme$request_method$host$uri";
    proxy_cache_valid 200 7d;
    proxy_cache_valid 206 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_valid any 1h;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_convert_head off;

    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Cache-Key "$scheme$request_method$host$uri";
    add_header X-Frame-Options "ALLOWALL";

    proxy_pass http://azure;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /download/ {
    proxy_cache upload_cache;
    proxy_cache_key "$scheme$request_method$host$uri";
    proxy_cache_valid 200 7d;
    proxy_cache_valid 206 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_convert_head off;

    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Frame-Options "ALLOWALL";

    proxy_pass http://azure/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
