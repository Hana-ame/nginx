user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	charset utf-8;

	server_names_hash_bucket_size 128;
	# server_name_in_redirect off;
	proxy_headers_hash_max_size 1024;   # 调大最大值（默认512）
    proxy_headers_hash_bucket_size 128; # 调大桶大小（默认64）


	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##
	include /etc/nginx/snippets/log-format.conf;

    access_log off;
    error_log /dev/null;

	##
	# Gzip Settings
	##

	gzip on;

	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 1;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;


	proxy_cache_path /root/cache keys_zone=mycache:10m levels=1:2 loader_threshold=300 loader_files=200	inactive=60m;
	proxy_cache_valid any 10m;
	proxy_cache_path /var/cache/nginx/upload_cache levels=1:2 keys_zone=upload_cache:50m max_size=2g inactive=7d use_temp_path=off;

	open_file_cache max=10000 inactive=30s;
	open_file_cache_valid 60s;
	open_file_cache_min_uses 2;
	open_file_cache_errors on;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


