server {
    listen 443 ssl http2;
    server_name bwh.moonchan.xyz;

    # ssl configuration
    ssl_certificate /root/.acme.sh/bwh.moonchan.xyz_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/bwh.moonchan.xyz_ecc/bwh.moonchan.xyz.key;

    # Improve HTTPS performance with session resumption
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Enable server-side protection against BEAST attacks
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384";

    location / {
        proxy_pass http://127.0.0.1:18789; # 转发到 OpenClaw 本地地址
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- 关键：支持 WebSocket 升级 ---
        proxy_http_version 1.1; # WebSocket 需要 HTTP 1.1 [citation:8]
        proxy_set_header Upgrade $http_upgrade; # 传递升级请求 [citation:2][citation:9]
        proxy_set_header Connection "upgrade"; # 保持连接升级 [citation:8]

        # --- 常规头部，保持原有设置 ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接超时设置，防止连接意外断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

}