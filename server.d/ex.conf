server {
  listen 80;
  server_name eh-web-viewer.moonchan.xyz ehwv.moonchan.xyz ex.moonchan.xyz;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80 default_server;
  server_name fujino.work.gd;

  location / {
    root /var/www/html;
  }
}

server {
  listen 443 ssl http2;
  server_name eh-web-viewer.moonchan.xyz;

  # ssl configuration
  include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

  access_log /dev/null;
  error_log /dev/null;

  include /etc/nginx/conf.d/addon/general-deny.conf;

  location /api/ {
    proxy_pass "http://127.25.23.2:8080/";
  }
  location /image/ {
    proxy_pass "http://127.25.23.1:8080/image/";
  }
  location / {
    try_files $uri $uri/ /index.html;
    root /var/www/ehwv-react;
  }

  # redirect server error pages to the static page /50x.html
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}

