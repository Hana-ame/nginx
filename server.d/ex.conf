server {
  listen 80;
  server_name eh-web-viewer.moonchan.xyz ehwv.moonchan.xyz ex.moonchan.xyz;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80 default_server;
  server_name moonchan.work.gd;

  location / {
    root /var/www/html;
  }
}

server {
  listen 443 ssl http2;
  server_name ehwv.moonchan.xyz ex.moonchan.xyz ex.nmbyd1.top ex.nmbyd2.top;

  # ssl configuration
  include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;
  # include /etc/nginx/conf.d/ssl/hana-sweet.top.conf;

  # access_log /dev/null;
  # error_log /dev/null;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

  location /fullimg.php {
    return 302 "https://moonchan.xyz/redirect.html";
  }

  location / {
    proxy_pass "http://127.25.23.2:8080/";
    proxy_set_header Host $host;
  }


  include /etc/nginx/conf.d/addon/general-deny.conf;
  include /etc/nginx/conf.d/addon/v2ray.conf;

  # redirect server error pages to the static page /50x.html
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}


