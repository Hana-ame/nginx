upstream chatto_reg {
    server 127.26.8.2:8080;

    # 保持 32 个长连接
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name chatto.810114.xyz;

    # ssl configuration
    include /etc/nginx/conf.d/ssl/810114.xyz.conf;

    access_log /var/log/nginx/chatto-reg.access.log;
    error_log /var/log/nginx/chatto-reg.error.log;

    location / {
        client_max_body_size 1m;

        # 1. 必须指向 upstream 的名称
        proxy_pass http://chatto_reg;

        # 2. 必须设置 HTTP/1.1 协议（keepalive 必须）
        proxy_http_version 1.1;

        # 3. 清除 Connection 头部（允许长连接传递）
        proxy_set_header Connection "";

        # 4. 建议传递真实的 Host 和 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name chatto.810114.xyz;
    return 301 https://$host$request_uri;
}
