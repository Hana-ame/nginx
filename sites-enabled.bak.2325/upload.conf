upstream azure {
    server 127.23.12.17:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name upload.moonchan.xyz upload.810114.xyz upload.nmbyd2.top upload.nmbyd3.top upload.nmbyd4.top;

    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    error_log /dev/null;

    location / {
        proxy_pass http://azure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_body_timeout 300s;

    location /api/ {
        client_max_body_size 50m;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        add_header X-Frame-Options "ALLOWALL";

        proxy_pass http://azure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /download/ {
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        add_header X-Frame-Options "ALLOWALL";

        proxy_pass http://azure/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}

server {
    listen 443 ssl http2;
    server_name upload.moonchan.publicvm.com;

    include /etc/nginx/conf.d/ssl/free_dns.conf;

    error_log /dev/null;

    location / {
        add_header X-Frame-Options "ALLOWALL";
        client_max_body_size 50m;
        proxy_pass http://azure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_body_timeout 300s;
}

server {
    listen 80;
    server_name upload.moonchan.publicvm.com;

    error_log /dev/null;

    location / {
        add_header X-Frame-Options "ALLOWALL";
        client_max_body_size 50m;
        proxy_pass http://azure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_body_timeout 300s;
}
