upstream s3proxy {
    server 127.26.8.23:8080;

    # 保持 32 个长连接
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name s3proxy.moonchan.xyz;

    # ssl configuration
    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    access_log /dev/null;
    error_log /dev/null;

    location / {
        # S3 网关:对象大小不定,默认 1m 会把所有 PUT 打成 413;0 = 不限
        client_max_body_size 0;

        # 大文件流式透传:不落 nginx 临时盘,边收边转发给后端
        # (需要 proxy_http_version 1.1,下面已设)
        proxy_request_buffering off;

        # 大对象传输耗时远超默认 60s,超时会掐断传一半的 PUT/GET
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 1. 必须指向 upstream 的名称
        proxy_pass http://s3proxy;

        # 2. 必须设置 HTTP/1.1 协议（keepalive 必须）
        proxy_http_version 1.1;

        # 3. 清除 Connection 头部（允许长连接传递）
        proxy_set_header Connection "";

        # 4. 建议传递真实的 Host 和 IP
        # Host 必须原样传递:SigV4 签名覆盖了公网域名,改写会导致 403
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
