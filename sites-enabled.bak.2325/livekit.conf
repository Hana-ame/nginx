server {
    listen [2607:f130:0:159::9b8b:826f]:443 ssl http2;
    server_name d.810114.xyz;

    include /etc/nginx/conf.d/ssl/810114.xyz.conf;

    access_log /var/log/nginx/livekit.access.log;
    error_log /var/log/nginx/livekit.error.log;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

server {
    listen [2607:f130:0:159::9b8b:826f]:80;
    server_name d.810114.xyz;
    return 301 https://$host$request_uri;
}
