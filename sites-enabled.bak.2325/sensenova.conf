upstream sensenova_backend {
    server 127.26.8.25:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name sensenova.moonchan.xyz;

    include /etc/nginx/conf.d/ssl/moonchan.xyz.conf;

    access_log /dev/null;
    error_log /dev/null;

    # /v1/ 路径转发到 api-pack 代理 (生图/编辑 API)
    location /v1/ {
        client_max_body_size 50m;
        proxy_pass http://sensenova_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 200s;
        proxy_read_timeout 200s;
    }

    # 根路径及所有其他路径返回生图工具 HTML
    location / {
        root /var/www/sensenova;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}