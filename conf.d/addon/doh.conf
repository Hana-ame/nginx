location = /doh {
  # 2. 关键：设置正确的 Host 头部
  # Cloudflare 必须依赖这个 Host 才能识别请求并匹配证书
  proxy_set_header Host cloudflare-dns.com;

  # 3. 关键：开启 SNI (Server Name Indication)
  # 否则 Nginx 在建立 TLS 连接时不会传域名，Cloudflare 会拒绝连接
  proxy_ssl_server_name on;

  # 4. 指向 upstream
  # 注意：这里要带上原始的路径 /dns-query
  proxy_pass https://cloudflare_dns/dns-query;

  # 5. 开启 HTTP/1.1 和清除 Connection
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  # 6. (可选) 针对 DoH 的建议优化
  # 禁用缓冲以减少延迟
  proxy_buffering off;
  # 传递原始 IP (虽然 Cloudflare 可能不看这个)
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
