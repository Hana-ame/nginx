# 已经和3x-ui合并了。

location = /ame/ { #/ray 路径需要和v2ray服务器端，客户端保持一致
    proxy_redirect off;
    proxy_pass http://127.25.12.103:8080; #此IP地址和端口需要和v2ray服务器保持一致，
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;

    # THE FIX: Send the mapped variable as the XFF and Real-IP
    proxy_set_header X-Forwarded-For $xray_xff;
    proxy_set_header X-Real-IP $xray_xff;
}

