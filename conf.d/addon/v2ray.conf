location /ame/ { #/ray 路径需要和v2ray服务器端，客户端保持一致
    proxy_redirect off;
    proxy_pass http://127.25.12.106:8388; #此IP地址和端口需要和v2ray服务器保持一致，
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
}

location = /mea {
    proxy_redirect off;
    proxy_pass http://127.25.12.105:8080; 
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
}

location = /aqua {
    proxy_redirect off;
    proxy_pass http://127.25.12.104:8080; 
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
}
