upstream twitter_backend {
    server 127.25.9.21:8080;
    keepalive 32;                  # 设置连接池大小（空闲保持的连接数）
    keepalive_timeout 60s;          # 空闲连接的超时时间
    keepalive_requests 1000;        # 单个连接上最多处理的请求数
}

upstream twimg_backend {
    server 127.25.9.15:8080;
    keepalive 16;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream ex_backend {
    server 127.25.23.2:8080;
    keepalive 32;
    keepalive_timeout 6s;
    keepalive_requests 1000;
}
