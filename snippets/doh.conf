location = /doh {
      # 必须指定协议为 https
      proxy_pass https://cloudflare_doh/dns-query;

      # 关键：强制使用 HTTP/1.1
      proxy_http_version 1.1;
      
      # 关键：清除 Connection 头，否则无法保持长连接
      proxy_set_header Connection "";
      
      # 必须设置正确的 Host 头，否则 Cloudflare 会返回 403
      proxy_set_header Host "cloudflare-dns.com";

      # 优化：设置合理的超时时间
      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
  }
